name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: syncup_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d syncup_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: server
        
    env:
      DATABASE_URL: postgresql://test:test@localhost:5433/syncup_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npm test